name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Go build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build host binary
        run: make build

      - name: Build linux release binary
        run: make linux-amd64-release VERSION=ci
