name: Release

on:
  workflow_dispatch:
    inputs:
      semver:
        description: Semantic version without v prefix
        required: true
        default: "0.1.0"
      upstream_version:
        description: Upstream IJG libjpeg version suffix
        required: true
        default: "9f"
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Bump tag and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Calculate next tag
        id: bump
        shell: bash
        run: |
          git fetch --tags --force
          tag="$(scripts/bump-up.sh --semver "${{ inputs.semver }}" --upstream-version "${{ inputs.upstream_version }}")"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "tag already exists: ${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "Next tag: ${tag}"

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build release binaries
        shell: bash
        run: |
          make clean
          make release \
            VERSION="${{ steps.bump.outputs.tag }}" \
            COMMIT="${GITHUB_SHA}" \
            DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            UPSTREAM_VERSION="${{ inputs.upstream_version }}"

      - name: Create and push tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${{ steps.bump.outputs.tag }}" dist/* \
            --title "${{ steps.bump.outputs.tag }}" \
            --notes "djpeg-go ${{ steps.bump.outputs.tag }} based on IJG libjpeg ${{ inputs.upstream_version }}." \
            "${args[@]}"
